<body class="menu-page emenu-layout" data-menu-theme="forest">
<script>
(function () {
    function emenuBrownRing(hex, alpha) {
        alpha = alpha == null ? 0.22 : alpha;
        if (!hex || hex.charAt(0) !== '#') return 'rgba(155,97,53,' + alpha + ')';
        var h = hex.slice(1);
        if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
        var r = parseInt(h.slice(0, 2), 16);
        var g = parseInt(h.slice(2, 4), 16);
        var b = parseInt(h.slice(4, 6), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function applyEmenuThemeCssVars(b, t) {
        b.setAttribute('data-menu-theme', t.id || 'light');
        if (t.light) b.classList.add('light-mode'); else b.classList.remove('light-mode');
        b.style.setProperty('--emenu-brown', t.brown);
        b.style.setProperty('--emenu-bg', t.bg);
        b.style.setProperty('--emenu-cat-bg', t.cat);
        b.style.setProperty('--emenu-card-bg', t.card);
        b.style.setProperty('--emenu-surface', t.surface);
        b.style.setProperty('--emenu-pill-bg', t.pill);
        b.style.setProperty('--emenu-fab-bg', t.fab);
        b.style.setProperty('--emenu-text', t.text);
        b.style.setProperty('--emenu-border', t.border);
        b.style.setProperty('--emenu-fab-text', t.fabText);
        b.style.setProperty('--emenu-curve', t.bg);
        b.style.setProperty('--emenu-hero-accent', t.brown);
        b.style.setProperty('--emenu-fab-accent', t.brown);
        b.style.setProperty('--emenu-fab-border', t.border);
        b.style.setProperty('--emenu-fab-accent-ring', emenuBrownRing(t.brown, 0.22));
        b.style.setProperty('--emenu-fab-accent-ring-strong', emenuBrownRing(t.brown, 0.38));
    }

    var themes = {
        light:  { id: 'light',  light: true,  brown: '#9B6135', bg: '#FFFFFF', cat: '#F8F8F8', card: '#FFFFFF', surface: '#FFFFFF', pill: '#FFFFFF', fab: '#FFFFFF', text: '#1A1A1A', border: '#E8E8E8', fabText: '#5F6368' },
        cream:  { id: 'cream',  light: true,  brown: '#8B6914', bg: '#FAF7F2', cat: '#F0E9DF', card: '#FFFFFF', surface: '#FFFFFF', pill: '#FFFFFF', fab: '#FFFFFF', text: '#2C2416', border: '#E8DFD2', fabText: '#6B5E54' },
        coffee: { id: 'coffee', light: true,  brown: '#6F4E37', bg: '#F5EDE3', cat: '#EBE0D4', card: '#FFFCF8', surface: '#FFFCF8', pill: '#FFFCF8', fab: '#FFFFFF', text: '#2A2018', border: '#DDD0C4', fabText: '#6B5344' },
        gold:   { id: 'gold',   light: true,  brown: '#B8910C', bg: '#FFFDF5', cat: '#FBF5E6', card: '#FFFFFF', surface: '#FFFFFF', pill: '#FFFFFF', fab: '#FFFFFF', text: '#1A1608', border: '#EDE4CC', fabText: '#6B6248' },
        red:    { id: 'red',    light: true,  brown: '#C21807', bg: '#FFF6F5', cat: '#F8EDEB', card: '#FFFFFF', surface: '#FFFFFF', pill: '#FFFFFF', fab: '#FFFFFF', text: '#1F1210', border: '#EDD5D2', fabText: '#6B4540' },
        mocha:  { id: 'mocha',  light: true,  brown: '#5C4033', bg: '#F3EBE4', cat: '#E8DDD4', card: '#FAF6F2', surface: '#FAF6F2', pill: '#FAF6F2', fab: '#FFFFFF', text: '#261A14', border: '#D9CEC4', fabText: '#6B5A50' },
        forest: { id: 'forest', light: false, brown: '#3ECF8E', bg: '#0F2A1D', cat: '#123222', card: '#123222', surface: '#143A28', pill: '#123222', fab: '#143A28', text: '#F4FFF9', border: 'rgba(62, 207, 142, 0.24)', fabText: '#F4FFF9' },
        dark:   { id: 'dark',   light: false, brown: '#C4956A', bg: '#141414', cat: '#1E1E1E', card: '#2A2A2A', surface: '#2A2A2A', pill: '#2A2A2A', fab: '#333333', text: '#F0F0F0', border: '#444444', fabText: '#CFCFCF' }
    };

    // Default brand theme is forest for the requested dark green redesign.
    var id = localStorage.getItem('menuTheme') || 'forest';
    try {
        if (!localStorage.getItem('menuThemeMigratedToForest')) {
            if (!localStorage.getItem('menuTheme') || id === 'light' || id === 'red') id = 'forest';
            localStorage.setItem('menuTheme', id);
            localStorage.setItem('menuThemeMigratedToForest', '1');
        }
    } catch (e) {}
    if (!themes[id]) id = 'forest';
    applyEmenuThemeCssVars(document.body, themes[id]);
    window.MENU_THEMES = themes;
    window.applyEmenuThemeCssVars = applyEmenuThemeCssVars;
    window.emenuBrownRing = emenuBrownRing;
})();
</script>

    <!-- Header -->

    <script>
        (function () {
            var heroLogo = document.querySelector('.menu-hero-logo');
            setupLogoClickActions(heroLogo, function () {
                window.location.href = 'index.html';
            });
        })();

        // Logo Click Handlers
        (function () {
            const headerLogo = document.getElementById('headerLogo');
            if (!headerLogo) return;

            let clickCount = 0;
            let clickTimer = null;

            headerLogo.addEventListener('click', function () {
                clickCount++;

                if (clickCount === 1) {
                    // First click - wait to see if it's a double click
                    clickTimer = setTimeout(function () {
                        // Single click - go to index.html
                        window.location.href = 'index.html';
                        clickCount = 0;
                    }, 300);
                } else if (clickCount === 2) {
                    // Double click - go to admin.html
                    clearTimeout(clickTimer);
                    window.location.href = 'admin.html';
                    clickCount = 0;
                }
            });
        })();

        // Fix dropdown positioning on mobile
        (function() {
            function fixDropdownPosition(btn, menu) {
                if (!btn || !menu) return;
                
                const btnRect = btn.getBoundingClientRect();
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const margin = 16;
                
                // Make menu visible temporarily to measure it
                const originalDisplay = menu.style.display;
                const originalVisibility = menu.style.visibility;
                menu.style.display = 'block';
                menu.style.visibility = 'hidden';
                
                const menuWidth = menu.offsetWidth || 160;
                const menuHeight = menu.offsetHeight || 200;
                
                // Restore
                menu.style.display = originalDisplay;
                menu.style.visibility = originalVisibility;
                
                // Set position to fixed
                menu.style.position = 'fixed';
                
                // Calculate horizontal position
                let left = btnRect.left;
                let right = 'auto';
                
                // Check if there's enough space on the right
                const spaceOnRight = screenWidth - btnRect.right;
                
                if (spaceOnRight >= menuWidth + margin) {
                    // Enough space on right - align right edge with button
                    left = btnRect.right - menuWidth;
                } else if (btnRect.left >= menuWidth + margin) {
                    // Enough space on left - align left edge with button
                    left = btnRect.left;
                } else {
                    // Not enough space on either side - center in available space
                    left = margin;
                    if (left + menuWidth > screenWidth - margin) {
                        left = screenWidth - menuWidth - margin;
                    }
                }
                
                // Ensure within viewport with margin
                if (left < margin) left = margin;
                if (left + menuWidth > screenWidth - margin) left = screenWidth - menuWidth - margin;
                
                // Calculate vertical position
                let top = btnRect.bottom + 8;
                let bottom = 'auto';
                
                const spaceBelow = screenHeight - btnRect.bottom;
                
                if (spaceBelow < menuHeight + margin) {
                    // Not enough space below - open above
                    top = btnRect.top - menuHeight - 8;
                    bottom = 'auto';
                }
                
                // Apply positioning
                menu.style.left = left + 'px';
                menu.style.right = right;
                menu.style.top = top + 'px';
                menu.style.bottom = bottom;
            }

            // Language dropdown
            const langBtn = document.getElementById('langDropdownBtn');
            const langMenu = document.getElementById('langDropdownMenu');
            if (langBtn && langMenu) {
                langBtn.addEventListener('click', function() {
                    setTimeout(() => fixDropdownPosition(langBtn, langMenu), 10);
                });
            }

            // Theme dropdown
            const themeBtn = document.getElementById('themeDropdownBtn');
            const themeMenu = document.getElementById('themeDropdownMenu');
            if (themeBtn && themeMenu) {
                themeBtn.addEventListener('click', function() {
                    setTimeout(() => fixDropdownPosition(themeBtn, themeMenu), 10);
                });
            }
            
            // Reposition on resize
            window.addEventListener('resize', function() {
                const langDropdown = document.getElementById('langDropdown');
                const themeDropdown = document.getElementById('themeDropdown');
                
                if (langDropdown && langDropdown.classList.contains('open') && langBtn && langMenu) {
                    fixDropdownPosition(langBtn, langMenu);
                }
                if (themeDropdown && themeDropdown.classList.contains('open') && themeBtn && themeMenu) {
                    fixDropdownPosition(themeBtn, themeMenu);
                }
            });
            
            // Reposition on scroll (for sticky header)
            window.addEventListener('scroll', function() {
                const langDropdown = document.getElementById('langDropdown');
                const themeDropdown = document.getElementById('themeDropdown');
                
                if (langDropdown && langDropdown.classList.contains('open') && langBtn && langMenu) {
                    fixDropdownPosition(langBtn, langMenu);
                }
                if (themeDropdown && themeDropdown.classList.contains('open') && themeBtn && themeMenu) {
                    fixDropdownPosition(themeBtn, themeMenu);
                }
            }, { passive: true });
        })();
    </script>
