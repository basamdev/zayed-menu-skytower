<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZAYED ALKHAIR</title>
    <link rel="manifest" href="manifest.json?v=119">
    <link rel="icon" type="image/png" href="images/zayed-logo.png?v=17">
    <link rel="shortcut icon" type="image/png" href="images/zayed-logo.png?v=17">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=17">
    <meta name="application-name" content="ZAYED ALKHAIR">
    <meta name="msapplication-TileColor" content="#B8860B">
    <meta name="msapplication-TileImage" content="assets/icon-512.png?v=17">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZAYED ALKHAIR">
    <meta name="theme-color" content="#B8860B">
    <style>html,body{background:#0A0A0B!important;}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=170">
    <style>
        :lang(en) {
            font-family: var(--font-body);
        }
        :lang(ar), :lang(ku) {
            font-family: var(--font-arabic);
        }

        /* Keep index dark — never inherit menu light theme */
        body.index-page,
        body.index-page.light-mode {
            background: #0A0A0B !important;
        }
        body.index-page .logo-splash,
        body.index-page.light-mode .logo-splash {
            background: #0A0A0B !important;
        }
        body.index-page .bg-video,
        body.index-page.light-mode .bg-video {
            opacity: 1 !important;
            filter: brightness(0.6) contrast(1.1) !important;
            background: #0A0A0B;
        }
        body.index-page .bg-overlay,
        body.index-page.light-mode .bg-overlay {
            background: linear-gradient(
                180deg,
                rgba(10,10,11,0.55) 0%,
                rgba(10,10,11,0.25) 40%,
                rgba(10,10,11,0.6) 100%
            ) !important;
        }

        /* New circular logo (text already on image) + red shadow */
        body.index-page .logo-splash img {
            width: clamp(120px, 30vw, 165px);
            height: clamp(120px, 30vw, 165px);
            max-width: none;
            border-radius: 50%;
            object-fit: contain;
            border: none;
            background: transparent;
            padding: 0;
            filter: drop-shadow(0 12px 28px rgba(184,134,11,0.55));
            box-shadow: none;
        }
        body.index-page .logo-float-wrap {
            width: clamp(145px, 32vw, 195px);
            height: clamp(145px, 32vw, 195px);
            border-radius: 50%;
            padding: 0;
            background: transparent;
            box-shadow: none;
            overflow: visible;
            line-height: 0;
        }
        body.index-page .hero .logo {
            width: 100% !important;
            height: 100% !important;
            max-width: none;
            border-radius: 50%;
            object-fit: contain;
            border: none;
            background: transparent;
            filter: drop-shadow(0 14px 32px rgba(184,134,11,0.55));
            box-shadow: none;
            transition: transform 0.3s ease, filter 0.3s ease;
            display: block;
        }
        body.index-page .hero .logo:hover {
            transform: scale(1.03);
            filter: drop-shadow(0 18px 40px rgba(184,134,11,0.65));
            box-shadow: none;
        }
        @media (max-width: 480px) {
            body.index-page .logo-splash img {
                width: 115px;
                height: 115px;
            }
            body.index-page .logo-float-wrap {
                width: 132px;
                height: 132px;
            }
        }

        /* Restored typewriter title under logo */
        body.index-page .cafe-name,
        body.index-page.light-mode .cafe-name {
            position: static !important;
            width: auto !important;
            height: auto !important;
            overflow: visible !important;
            clip: auto !important;
            font-family: "Cairo", "Tajawal", var(--font-arabic), sans-serif !important;
            letter-spacing: 0 !important;
            font-size: clamp(1.35rem, 4.8vw, 2rem);
            font-weight: 700;
            line-height: 1.35;
            text-transform: none;
            color: #FFFFFF !important;
            text-shadow: 0 2px 16px rgba(0,0,0,0.55);
            margin-top: 0.5rem;
        }
        body.index-page .cafe-name .menu-hero-typewriter,
        body.index-page .cafe-name .menu-hero-typed,
        body.index-page #heroTitleTyped {
            font-family: inherit !important;
            letter-spacing: 0 !important;
            color: #FFFFFF !important;
            font-size: inherit;
            text-shadow: 0 2px 16px rgba(0,0,0,0.55);
            white-space: normal;
        }
        body.index-page .cafe-name .menu-hero-typewriter[dir="ltr"],
        body.index-page .cafe-name .menu-hero-typed[dir="ltr"] {
            font-family: "Playfair Display", "Cinzel", serif !important;
            letter-spacing: 0.04em !important;
        }
        body.index-page .cafe-name .menu-hero-cursor {
            background: #FFFFFF !important;
            box-shadow: 0 0 8px rgba(255,255,255,0.45);
        }

        body.index-page .logo-splash-dots span {
            background: #B8860B !important;
        }

        /* Language buttons — Zayed logo dark teal green */
        body.index-page {
            --zayed-green: #064A42;
            --zayed-green-deep: #033830;
            --zayed-green-soft: #0A5C52;
            --zayed-gold: #C4A35A;
        }

        body.index-page .lang-group .lang-btn,
        body.index-page .hero .lang-btn {
            font-family: inherit;
            background: linear-gradient(160deg, var(--zayed-green-soft) 0%, var(--zayed-green) 55%, var(--zayed-green-deep) 100%) !important;
            color: #F7FFF9 !important;
            border: 1.5px solid color-mix(in srgb, var(--zayed-gold) 55%, transparent) !important;
            box-shadow: 0 8px 22px rgba(3, 56, 48, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
        }

        body.index-page .hero .lang-btn:hover {
            background: linear-gradient(160deg, #0D6B5F 0%, var(--zayed-green-soft) 50%, var(--zayed-green) 100%) !important;
            color: #FFFFFF !important;
            border-color: var(--zayed-gold) !important;
            box-shadow: 0 10px 28px rgba(6, 74, 66, 0.55), 0 0 0 1px rgba(196, 163, 90, 0.25) !important;
            transform: translateY(-3px);
        }

        body.index-page .hero .lang-btn.active {
            background: linear-gradient(160deg, #0E6F62 0%, #075248 100%) !important;
            color: #FFFFFF !important;
            border-color: var(--zayed-gold) !important;
            box-shadow: 0 6px 24px rgba(6, 74, 66, 0.55), 0 0 0 2px rgba(196, 163, 90, 0.35) !important;
            font-weight: 700;
        }

        body.index-page .lang-sep {
            color: color-mix(in srgb, var(--zayed-gold) 70%, #fff) !important;
            opacity: 0.7;
            font-family: inherit;
        }
    </style>
</head>
<body class="index-page has-video-bg">


    <video class="bg-video" autoplay muted loop playsinline>
        <source src="images/zayed-video.MP4?v=3" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <section class="hero">
        <div class="hero-center">
<div class="logo-float-wrap">
                 <img src="images/zayed-logo.png?v=16" alt="ZAYED ALKHAIR" class="logo" id="indexLogo"
                     onerror="this.onerror=null; this.src='images/zayed-logo.png?v=16';">
               </div>
               <h1 class="cafe-name">
                 <span class="menu-hero-typewriter" id="heroTypewriter" aria-live="polite">
                     <span class="menu-hero-typed" id="heroTitleTyped" dir="ltr" lang="en">ZAYED ALKHAIR</span><span class="menu-hero-cursor" id="heroTitleCursor" aria-hidden="true"></span>
                 </span>
               </h1>

            <div class="lang-group">
                <button class="lang-btn" data-lang="ku" onclick="openMenu('ku')">
                    <span class="lang-flag"><img src="images/flag-kurdistan.svg" alt="" class="lang-flag-img" width="22" height="15"></span>
                    <span>کوردی</span>
                </button>
                <span class="lang-sep">|</span>
                <button class="lang-btn" data-lang="ar" onclick="openMenu('ar')">
                    <span class="lang-flag">🇮🇶</span>
                    <span>العربية</span>
                </button>
                <span class="lang-sep">|</span>
                <button class="lang-btn" data-lang="en" onclick="openMenu('en')">
                    <span class="lang-flag">🇬🇧</span>
                    <span>English</span>
                </button>
            </div>
        </div>
    </section>

    <script src="js/app.js?v=155"></script>
    <script>
        (function () {
            document.body.classList.remove('light-mode');
            var logo = document.getElementById('indexLogo');
            // Single → menu.html | Double → admin.html
            setupLogoClickActions(logo, function () {
                window.location.href = 'menu.html';
            }, 'admin.html');
        })();
    </script>
</body>
</html>
