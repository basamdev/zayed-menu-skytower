<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZAYED ALKHAIR - Admin Panel</title>
    <link rel="manifest" href="manifest.json?v=118">
    <link rel="icon" type="image/png" href="assets/icon-192.png?v=16">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=16">
    <meta name="application-name" content="ZAYED ALKHAIR">
    <meta name="msapplication-TileColor" content="#B8860B">
    <meta name="msapplication-TileImage" content="assets/icon-512.png?v=16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZAYED ALKHAIR">
    <meta name="theme-color" content="#B8860B">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css?v=124">
    <script>
        (function () {
            try {
                var a = localStorage.getItem('adminAccent') || 'sapphire';
                document.documentElement.setAttribute('data-accent', a);
            } catch (e) {
                document.documentElement.setAttribute('data-accent', 'sapphire');
            }
        })();
    </script>
</head>
<body class="admin-page">
    <div class="admin-container admin-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <a class="sidebar-brand" href="menu.html" title="Open menu">
                    <img src="images/zayed-logo.png?v=16" alt="ZAYED ALKHAIR" class="sidebar-brand-icon" onerror="fallbackLogo(this)">
                    <span class="sidebar-brand-text">ZAYED ALKHAIR</span>
                </a>
                <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
            </div>
            <div class="sidebar-nav">
                <button class="nav-item admin-nav-btn" data-section="items">
                    <span class="nav-item-icon">🍽️</span><span data-i18n="manageItems">Items</span>
                </button>
                <button class="nav-item admin-nav-btn" data-section="categories">
                    <span class="nav-item-icon">📁</span><span data-i18n="manageCategories">Categories</span>
                </button>
                <button class="nav-item admin-nav-btn" data-section="offers">
                    <span class="nav-item-icon">🏷️</span><span data-i18n="manageOffers">Offers</span>
                </button>
                <button class="nav-item" id="adminSettingsBtn">
                    <span class="nav-item-icon">⚙️</span><span data-i18n="settings">Settings</span>
                </button>
                <a class="nav-item" href="menu.html" id="adminViewMenuLink">
                    <span class="nav-item-icon">🌐</span><span data-i18n="viewMenu">View Menu</span>
                </a>
                <button class="nav-item admin-nav-btn nav-item--logout" data-section="logout">
                    <span class="nav-item-icon">🚪</span><span data-i18n="logout">Logout</span>
                </button>
            </div>
        </div>
        <div class="admin-main">
            <div class="admin-header">
                <div class="admin-header-left">
                    <button class="sidebar-hamburger" id="sidebarHamburger" aria-label="Open menu">
                        <span></span><span></span><span></span>
                    </button>
                    <h1 class="admin-title">Admin Panel</h1>
                </div>
                <div class="admin-header-actions">
                    <div class="admin-lang-switcher">
                        <button class="admin-lang-btn" data-lang="ku">KU</button>
                        <button class="admin-lang-btn" data-lang="ar">AR</button>
                        <button class="admin-lang-btn active" data-lang="en">EN</button>
                    </div>
                    <button class="admin-theme-toggle" id="adminThemeToggle">🌙</button>
                </div>
            </div>
            <div id="adminContent"></div>
        </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
      import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
      import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, setDoc, writeBatch, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAaRgvO5EDrr7vU8MoW8UGVO45c9h1UAqI",
        authDomain: "zayed-menu-skytower.firebaseapp.com",
        projectId: "zayed-menu-skytower",
        storageBucket: "zayed-menu-skytower.firebasestorage.app",
        messagingSenderId: "1041176038213",
        appId: "1:1041176038213:web:2d920a41161e5f81d70c2c"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.firebaseApp = app;
      window.auth = auth;
      window.db = db;
      window.firebaseConfig = firebaseConfig;
      window.setPersistence = setPersistence;
      window.browserLocalPersistence = browserLocalPersistence;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.signOut = signOut;
      window.onAuthStateChanged = onAuthStateChanged;
      window.collection = collection;
      window.doc = doc;
      window.getDoc = getDoc;
      window.getDocs = getDocs;
      window.addDoc = addDoc;
      window.updateDoc = updateDoc;
      window.deleteDoc = deleteDoc;
      window.query = query;
      window.where = where;
      window.orderBy = orderBy;
      window.limit = limit;
      window.onSnapshot = onSnapshot;
      window.setDoc = setDoc;
      window.writeBatch = writeBatch;
      window.serverTimestamp = serverTimestamp;
      window.Timestamp = Timestamp;
    </script>
    <script src="js/firebase.js?v=126"></script>
    <script src="js/menu-data.js?v=130"></script>
    <script src="js/app.js?v=132"></script>
    <script src="js/local-api.js?v=120"></script>
    <script src="js/admin.js?v=133"></script>
</body>
</html>
